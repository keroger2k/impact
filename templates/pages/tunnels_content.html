<div class="d-flex flex-column gap-3">

  <!-- ── Stats / Toolbar ─────────────────────────────────────────────── -->
  <div class="card shadow-sm border-0 animate-fade-in">
    <div class="card-body py-3">
      <div class="d-flex flex-wrap align-items-center gap-3">
        <div class="d-flex align-items-center gap-2">
          <i class="ph ph-lock-key fs-4 text-primary"></i>
          <strong class="fs-5">Enterprise IPsec Tunnels</strong>
        </div>

        <div id="tunnel-stats" class="ms-3 d-flex gap-3 flex-wrap small text-muted"
             hx-get="/api/tunnels/stats" hx-trigger="load, every 60s" hx-swap="innerHTML">
          <span><i class="ph ph-circle-notch ph-spin"></i> Loading stats…</span>
        </div>

        <div class="ms-auto d-flex gap-2 align-items-center">
          <input id="tun-q" type="search" class="form-control form-control-sm" style="width:240px"
                 placeholder="Search hostname / peer / interface…"
                 hx-get="/api/tunnels/inventory"
                 hx-target="#tunnels-list"
                 hx-trigger="keyup changed delay:300ms, search"
                 hx-include="#tun-type,#tun-platform,#tun-flatten"
                 name="q">

          <select id="tun-type" class="form-select form-select-sm" style="width:140px"
                  hx-get="/api/tunnels/inventory"
                  hx-target="#tunnels-list"
                  hx-trigger="change"
                  hx-include="#tun-q,#tun-platform,#tun-flatten"
                  name="type">
            <option value="">All types</option>
            <option value="dmvpn">DMVPN</option>
            <option value="svti">sVTI</option>
            <option value="dvti">dVTI</option>
            <option value="crypto_map">Policy-based</option>
            <option value="gre_over_ipsec">GRE/IPsec</option>
            <option value="palo_ipsec">Palo IPsec</option>
          </select>

          <select id="tun-platform" class="form-select form-select-sm" style="width:130px"
                  hx-get="/api/tunnels/inventory"
                  hx-target="#tunnels-list"
                  hx-trigger="change"
                  hx-include="#tun-q,#tun-type,#tun-flatten"
                  name="platform">
            <option value="">All platforms</option>
            <option value="ios">Cisco IOS</option>
            <option value="palo">Palo Alto</option>
          </select>

          <div class="form-check form-switch d-flex align-items-center gap-2 mb-0" style="min-width:130px"
               title="Show each DMVPN spoke as its own row instead of collapsing into clouds">
            <input class="form-check-input" type="checkbox"
                   id="tun-flatten" name="flatten" value="true"
                   hx-get="/api/tunnels/inventory"
                   hx-target="#tunnels-list"
                   hx-trigger="change"
                   hx-include="#tun-q,#tun-type,#tun-platform">
            <label class="form-check-label small" for="tun-flatten">Show all spokes</label>
          </div>

          <a class="btn btn-outline btn-sm" href="/api/tunnels/export.csv" download>
            <i class="ph ph-download-simple"></i> CSV
          </a>

          <button id="tun-refresh-btn" class="btn btn-action btn-sm"
                  onclick="tunnelsStreamRefresh()">
            <i class="ph ph-arrows-clockwise"></i> Rebuild
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Progress panel (visible during builds; stays open after) ─────── -->
  <div id="tunnel-progress" class="card shadow-sm border-0 animate-fade-in" style="display:none;">
    <div class="card-header bg-navy text-white d-flex align-items-center gap-2">
      <i id="tunnel-progress-icon" class="ph ph-circle-notch ph-spin"></i>
      <span id="tunnel-progress-title" class="fw-bold">Building tunnel inventory…</span>
      <span id="tunnel-progress-elapsed" class="ms-2 small text-light opacity-75"></span>
      <div class="ms-auto d-flex align-items-center gap-2 small text-light opacity-75">
        <span id="tunnel-progress-step-label">starting…</span>
        <button id="tunnel-progress-close" type="button"
                class="btn btn-sm btn-link text-white p-0 ms-2"
                style="display:none; line-height:1; text-decoration:none;"
                title="Close (logs stay until next rebuild)"
                onclick="document.getElementById('tunnel-progress').style.display='none'">
          <i class="ph ph-x" style="font-size:16px"></i>
        </button>
      </div>
    </div>
    <div class="card-body p-0">
      <div id="tunnel-progress-bar-wrap" class="px-3 pt-3" style="display:none">
        <div class="d-flex justify-content-between small text-muted mb-1">
          <span id="tunnel-progress-bar-label">Templates</span>
          <span id="tunnel-progress-bar-count">0 / 0</span>
        </div>
        <div class="progress" style="height:6px;">
          <div id="tunnel-progress-bar" class="progress-bar" role="progressbar" style="width:0%"></div>
        </div>
      </div>
      <div class="d-flex justify-content-end px-3 pt-2 pb-1">
        <button class="btn btn-outline btn-xs" type="button" onclick="copyTunnelLog()">
          <i class="ph ph-copy"></i> Copy log
        </button>
      </div>
      <div id="tunnel-progress-log"
           style="font-family: var(--font-mono, monospace); font-size: 12px;
                  max-height: 520px; overflow-y: auto; padding: 12px 16px;
                  background: #0f172a; color: #e2e8f0;">
      </div>
    </div>
  </div>

  <!-- ── List + Detail layout ────────────────────────────────────────── -->
  <div id="tunnels-main" class="row g-3">
    <div class="col-lg-7">
      <div id="tunnels-list"
           hx-get="/api/tunnels/inventory"
           hx-trigger="load, refresh"
           hx-swap="innerHTML"
           style="min-height: 400px;">
        <div class="card border-0 shadow-sm">
          <div class="card-body text-center py-5 text-muted">
            <div class="spinner spinner-lg mb-3"></div>
            <p class="mb-1">Checking tunnel inventory…</p>
            <p class="small text-muted">If this is the first load, hit <strong>Rebuild</strong> to start the parser.</p>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div id="tunnel-detail" class="sticky-top" style="top:12px;">
        <div class="card border-0 shadow-sm">
          <div class="card-body text-center py-5 text-muted">
            <i class="ph ph-mouse-simple-pointer fs-1 d-block mb-2"></i>
            <p class="mb-0">Select a tunnel for crypto + endpoint detail.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .tunnel-row { cursor: pointer; transition: background-color .15s; }
  .tunnel-row:hover { background-color: rgba(59,130,246,0.05); }
  .tunnel-row.active { background-color: rgba(59,130,246,0.10); border-left: 3px solid var(--accent); }
  .type-badge { font-family: var(--font-mono, monospace); font-size: 11px; letter-spacing: .02em; }
  .crypto-cell { font-family: var(--font-mono, monospace); font-size: 11px; color: var(--text-muted); }
  .tunnel-log-line { white-space: pre-wrap; line-height: 1.5; }
  .tunnel-log-info    { color: #cbd5e1; }
  .tunnel-log-success { color: #86efac; }
  .tunnel-log-warn    { color: #fbbf24; }
  .tunnel-log-error   { color: #fca5a5; }
  .tunnel-log-ts      { color: #64748b; margin-right: 8px; }
</style>

<script>
  (function(){
    // Stats partial render — converts the JSON response to inline chips.
    document.body.addEventListener('htmx:afterSwap', function(evt){
      if (evt.detail.target.id === 'tunnel-stats') {
        try {
          const data = JSON.parse(evt.detail.xhr.responseText);
          const s = data.stats || {};
          const parts = [];
          parts.push(`<span><strong>${s.total||0}</strong> total</span>`);
          const types = s.by_type || {};
          const labels = {dmvpn:'DMVPN', svti:'sVTI', dvti:'dVTI',
                          crypto_map:'Policy', gre_over_ipsec:'GRE/IPsec',
                          palo_ipsec:'Palo', gre:'GRE'};
          for (const [k,v] of Object.entries(types)) {
            parts.push(`<span><strong>${v}</strong> ${labels[k]||k}</span>`);
          }
          if (data.built_at) {
            const age = Math.round((Date.now()/1000 - data.built_at)/60);
            parts.push(`<span class="text-muted"><i class="ph ph-clock"></i> ${age}m ago</span>`);
          }
          evt.detail.target.innerHTML = parts.join('');
        } catch(e) {/* let htmx render raw */}
      }
    });
  })();

  window.copyTunnelLog = function() {
    const log = document.getElementById('tunnel-progress-log');
    if (!log) return;
    // Convert to plain text with timestamps preserved.
    const text = Array.from(log.querySelectorAll('.tunnel-log-line'))
      .map(line => line.innerText)
      .join('\n');
    navigator.clipboard.writeText(text).then(
      () => {
        const btn = event.target.closest('button');
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="ph ph-check"></i> Copied';
        setTimeout(() => { btn.innerHTML = orig; }, 1500);
      },
      (err) => alert('Copy failed: ' + err)
    );
  };

  // ── Streaming rebuild ──
  // POSTs to /api/tunnels/refresh-stream, parses SSE events, and renders a
  // live log + progress bar so the 5-minute Palo walk isn't a black box.
  let __tunActiveES = null;
  let __tunStartTs = 0;
  let __tunElapsedTimer = null;

  window.tunnelsStreamRefresh = async function() {
    if (__tunActiveES) return;  // already running

    const panel = document.getElementById('tunnel-progress');
    const log   = document.getElementById('tunnel-progress-log');
    const main  = document.getElementById('tunnels-main');
    const btn   = document.getElementById('tun-refresh-btn');
    const elapsed = document.getElementById('tunnel-progress-elapsed');
    const stepLabel = document.getElementById('tunnel-progress-step-label');
    const barWrap = document.getElementById('tunnel-progress-bar-wrap');
    const bar     = document.getElementById('tunnel-progress-bar');
    const barCount = document.getElementById('tunnel-progress-bar-count');

    log.innerHTML = '';
    panel.style.display = 'block';
    btn.disabled = true;
    btn.innerHTML = '<i class="ph ph-circle-notch ph-spin"></i> Building…';
    __tunStartTs = Date.now();
    elapsed.textContent = '0s';
    stepLabel.textContent = 'starting…';
    barWrap.style.display = 'none';
    // Reset the spinner + title in case a prior run set them to "done"
    document.getElementById('tunnel-progress-icon').className = 'ph ph-circle-notch ph-spin';
    document.getElementById('tunnel-progress-title').textContent = 'Building tunnel inventory…';
    document.getElementById('tunnel-progress-close').style.display = 'none';

    __tunElapsedTimer = setInterval(() => {
      const s = Math.floor((Date.now() - __tunStartTs) / 1000);
      const mins = Math.floor(s / 60), secs = s % 60;
      elapsed.textContent = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
    }, 1000);

    const appendLog = (level, message) => {
      const ts = new Date().toLocaleTimeString('en-US', {hour12:false});
      const line = document.createElement('div');
      line.className = `tunnel-log-line tunnel-log-${level||'info'}`;
      line.innerHTML = `<span class="tunnel-log-ts">${ts}</span>${escapeHtml(message)}`;
      // Smart auto-scroll: only follow if the user is already at the bottom.
      // Lets them scroll up to read past lines without being yanked back.
      const stickToBottom = (log.scrollHeight - log.scrollTop - log.clientHeight) < 30;
      log.appendChild(line);
      if (stickToBottom) log.scrollTop = log.scrollHeight;
    };
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    // Use fetch + ReadableStream so we can POST (EventSource is GET-only).
    let response;
    try {
      response = await fetch('/api/tunnels/refresh-stream', {
        method: 'POST',
        credentials: 'include',
        headers: {
          'X-CSRF-Token': (document.cookie.split('; ').find(r=>r.startsWith('csrf_token=')) || '').split('=')[1] || '',
        },
      });
    } catch (e) {
      appendLog('error', `Failed to start stream: ${e}`);
      finish(false); return;
    }

    if (!response.ok) {
      appendLog('error', `HTTP ${response.status} ${response.statusText}`);
      finish(false); return;
    }

    __tunActiveES = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    const finish = (success) => {
      clearInterval(__tunElapsedTimer);
      btn.disabled = false;
      btn.innerHTML = '<i class="ph ph-arrows-clockwise"></i> Rebuild';
      __tunActiveES = null;
      stepLabel.textContent = success ? 'done' : 'failed';
      // Replace the spinning header with a static one; show the × close button.
      const headerIcon = document.getElementById('tunnel-progress-icon');
      const headerTitle = document.getElementById('tunnel-progress-title');
      if (success) {
        headerIcon.className = 'ph ph-check-circle';
        headerTitle.textContent = 'Build complete';
      } else {
        headerIcon.className = 'ph ph-warning';
        headerTitle.textContent = 'Build failed';
      }
      document.getElementById('tunnel-progress-close').style.display = '';
      // Re-pull stats and inventory once the build is finished.
      // NOTE: do NOT auto-hide the panel — the user wants to review the log.
      if (success) {
        htmx.ajax('GET', '/api/tunnels/stats', {target:'#tunnel-stats', swap:'innerHTML'});
        htmx.ajax('GET', '/api/tunnels/inventory', {target:'#tunnels-list', swap:'innerHTML'});
      }
    };

    try {
      while (true) {
        const {value, done} = await __tunActiveES.read();
        if (done) break;
        buf += decoder.decode(value, {stream: true});
        const events = buf.split('\n\n');
        buf = events.pop();  // last (possibly incomplete) event stays in buffer

        for (const raw of events) {
          if (!raw.startsWith('data: ')) continue;
          let ev;
          try { ev = JSON.parse(raw.slice(6)); } catch { continue; }

          if (ev.type === 'log') {
            appendLog(ev.level || 'info', ev.message || '');
            if (ev.message && /Querying Panorama|Listing Panorama|Fetching template/i.test(ev.message)) {
              stepLabel.textContent = 'palo';
            } else if (ev.message && /Loading DNAC/i.test(ev.message)) {
              stepLabel.textContent = 'dnac';
            } else if (ev.message && /Parsing IPsec/i.test(ev.message)) {
              stepLabel.textContent = 'parse';
            } else if (ev.message && /Building normalized/i.test(ev.message)) {
              stepLabel.textContent = 'build';
            }
          } else if (ev.type === 'progress') {
            if ((ev.step === 'palo_template' || ev.step === 'palo_stack') && ev.total) {
              barWrap.style.display = 'block';
              const pct = Math.round(100 * (ev.done||0) / ev.total);
              bar.style.width = `${pct}%`;
              const label = ev.step === 'palo_stack' ? 'Template-stacks' : 'Templates';
              document.getElementById('tunnel-progress-bar-label').textContent = label;
              barCount.textContent = `${ev.done}/${ev.total}`;
            }
          } else if (ev.type === 'complete') {
            appendLog('success', `Complete. ${ev.stats?.total ?? 0} tunnels.`);
            finish(true);
            return;
          } else if (ev.type === 'error') {
            appendLog('error', ev.message || 'Unknown error');
            finish(false);
            return;
          }
        }
      }
      // Stream ended without a 'complete' marker — treat as failure but still
      // refresh the list, since partial cache may have been written.
      finish(false);
      htmx.ajax('GET', '/api/tunnels/inventory', {target:'#tunnels-list', swap:'innerHTML'});
    } catch (e) {
      appendLog('error', `Stream error: ${e}`);
      finish(false);
    }
  };
</script>
