<div class="row g-4 h-100">
  <div class="col-md-4">
    <div class="card shadow-sm border-0 animate-fade-in h-100">
      <div class="card-header bg-navy text-white d-flex align-items-center gap-2">
        <i class=" ph ph-terminal"></i>
        <span class="fw-bold">Command Runner</span>
      </div>
      <div class="card-body">
        {% if config_changes_enabled %}
        <!-- Mode toggle (only if Config mode is enabled in env) -->
        <div class="btn-group w-100 mb-3" role="group" aria-label="Mode">
          <input type="radio" class="btn-check" name="cmd-mode" id="mode-show" value="show" checked
                 onchange="switchMode('show')">
          <label class="btn btn-outline-primary" for="mode-show">
            <i class="ph ph-eye me-1"></i> Show
          </label>
          <input type="radio" class="btn-check" name="cmd-mode" id="mode-config" value="config"
                 onchange="switchMode('config')">
          <label class="btn btn-outline-danger" for="mode-config">
            <i class="ph ph-pencil-line me-1"></i> Config
          </label>
        </div>
        {% endif %}

        <form id="cmd-form">
          <div class="mb-3">
            <label class="form-label text-navy fw-bold small uppercase letter-spacing-1">DNAC Devices</label>
            <div id="device-selector-wrap" hx-get="/api/dnac/devices-select" hx-trigger="load" hx-target="#device-select-container">
               <div id="device-select-container">
                  <div class="spinner spinner-sm"></div>
               </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-navy fw-bold small uppercase letter-spacing-1">Manual IP List</label>
            <textarea id="manual-ips" class="form-control form-control-sm" rows="3" placeholder="Paste IP addresses here (one per line)..."></textarea>
          </div>

          <!-- SHOW MODE INPUTS -->
          <div id="show-inputs">
            <div class="mb-3 border-top pt-3">
              <label class="form-label text-navy fw-bold small uppercase letter-spacing-1">Diagnostic Template</label>
              <select name="command_preset" class="form-select" onchange="document.getElementById('custom-cmd').value = this.value">
                <option value="">-- Custom --</option>
                <option value="show ip route">Show IP Route</option>
                <option value="show ip bgp summary">Show BGP Summary</option>
                <option value="show ip eigrp topology">Show EIGRP Topology</option>
                <option value="show version">Show Version</option>
                <option value="show inventory">Show Inventory</option>
                <option value="show running-config">Show Config</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="form-label text-navy fw-bold small uppercase letter-spacing-1">Command</label>
              <textarea id="custom-cmd" name="command" class="form-control" rows="4" placeholder="Enter command to run..."></textarea>
            </div>
            <button type="button" onclick="executeCommands()" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
              <i class=" ph ph-play me-1"></i> Run on Targets
            </button>
          </div>

          <!-- CONFIG MODE INPUTS -->
          <div id="config-inputs" style="display:none">
            <div class="alert alert-warning small mb-3 py-2">
              <i class="ph ph-warning-circle me-1"></i>
              Config mode pushes commands directly via SSH. No automatic rollback — review carefully before pushing.
            </div>

            <div class="mb-3 border-top pt-3">
              <label class="form-label text-navy fw-bold small uppercase letter-spacing-1">Config Script</label>
              <textarea id="config-script" class="form-control" rows="10"
                style="font-family: 'SF Mono', monospace; font-size: 12px;"
                placeholder="e.g.
ip access-list extended ACL_MGMT
  permit tcp any host 10.0.0.1 eq 22"></textarea>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="config-save" checked>
              <label class="form-check-label small" for="config-save">
                Save to startup-config after push (<code>write memory</code>)
              </label>
            </div>

            <div class="mb-3">
              <label class="form-label text-navy fw-bold small">Type <code>DEPLOY</code> to enable</label>
              <input type="text" id="config-confirm" class="form-control" oninput="updateDeployBtn()" placeholder="DEPLOY">
            </div>

            <button type="button" id="config-deploy-btn" onclick="executeConfigPush()" disabled
                    class="btn btn-danger w-100 py-2 fw-bold shadow-sm">
              <i class=" ph ph-upload-simple me-1"></i> Push Config
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-8 d-flex flex-column">
    <div class="card shadow-sm border-0 animate-fade-in flex-grow-1 overflow-hidden">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span class="fw-bold small text-uppercase letter-spacing-1">Live Console Output</span>
        <div class="d-flex gap-2">
           <div id="cmd-progress-label" class="text-info small me-3"></div>
          <button class="btn btn-sm btn-outline-light px-2" onclick="clearOutput()">
            <i class=" ph ph-trash"></i>
          </button>
        </div>
      </div>
      <div class="card-body p-0 bg-dark overflow-auto" style="min-height: 500px;">
        <div id="cmd-output" class="p-4 text-success mb-0" style="font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.6;"></div>
      </div>
    </div>
  </div>
</div>

<script>
  function switchMode(mode) {
    document.getElementById('show-inputs').style.display   = mode === 'show' ? '' : 'none';
    document.getElementById('config-inputs').style.display = mode === 'config' ? '' : 'none';
    clearOutput();
  }

  function clearOutput() {
    document.getElementById('cmd-output').innerHTML = '';
    document.getElementById('cmd-progress-label').textContent = '';
  }

  function updateDeployBtn() {
    const ok = document.getElementById('config-confirm').value === 'DEPLOY';
    document.getElementById('config-deploy-btn').disabled = !ok;
  }

  function gatherDevices() {
    let devices = [];
    const select = document.getElementById('device-multi-select');
    if (select) {
        Array.from(select.selectedOptions).forEach(opt => {
           const data = JSON.parse(opt.getAttribute('data-device'));
           devices.push({ ip: data.ip, hostname: data.hostname, platform: data.platform });
        });
    }
    const manualIps = document.getElementById('manual-ips').value;
    if (manualIps) {
        manualIps.split('\n').map(ip => ip.trim()).filter(ip => ip.length > 0).forEach(ip => {
            if (!devices.some(d => d.ip === ip)) {
                devices.push({ ip: ip, hostname: ip, platform: 'unknown' });
            }
        });
    }
    return devices;
  }

  function csrfHeader() {
    const csrfToken = document.cookie.split('; ').find(row => row.startsWith('csrf_token='));
    return csrfToken ? csrfToken.split('=')[1] : '';
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function streamSSE(url, body, onEvent) {
    const resp = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-CSRF-Token': csrfHeader()},
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      let detail = resp.statusText;
      try { detail = (await resp.json()).detail || detail; } catch(_) {}
      const err = document.createElement('div');
      err.className = 'text-danger fw-bold';
      err.textContent = `>> Request failed (${resp.status}): ${detail}`;
      document.getElementById('cmd-output').appendChild(err);
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) {
        if (buf.startsWith('data: ')) {
          try { onEvent(JSON.parse(buf.substring(6))); } catch(_) {}
        }
        break;
      }
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try { onEvent(JSON.parse(line.substring(6))); } catch(_) {}
        }
      }
    }
  }

  function renderDeviceResult(data) {
    const progress = document.getElementById('cmd-progress-label');
    progress.textContent = `Progress: ${data.done} / ${data.total}`;
    const container = document.createElement('div');
    container.className = 'mt-3 border-top border-secondary pt-2';
    const header = document.createElement('span');
    header.className = 'fw-bold text-info';
    header.textContent = `[${data.hostname} (${data.ip})]`;
    container.appendChild(header);
    container.appendChild(document.createElement('br'));
    if (data.status === 'success') {
      const pre = document.createElement('pre');
      pre.className = 'text-success';
      pre.textContent = data.output;
      container.appendChild(pre);
    } else {
      const span = document.createElement('span');
      span.className = 'text-danger';
      span.textContent = data.error;
      container.appendChild(span);
    }
    const output = document.getElementById('cmd-output');
    output.appendChild(container);
    output.scrollTop = output.scrollHeight;
  }

  function executeCommands() {
    const command = document.getElementById('custom-cmd').value;
    if (!command) { alert("Please enter a command."); return; }
    const devices = gatherDevices();
    if (devices.length === 0) {
      alert("Please select a device or enter an IP address."); return;
    }

    clearOutput();
    const init = document.createElement('div');
    init.className = 'text-info';
    init.textContent = `>> Initializing session for ${devices.length} targets...`;
    document.getElementById('cmd-output').appendChild(init);

    streamSSE('/api/commands/run', {devices, command, timeout: 60}, (data) => {
      if (data.type === 'progress') renderDeviceResult(data);
      else if (data.type === 'complete') {
        const div = document.createElement('div');
        div.className = 'mt-4 text-info fw-bold';
        div.textContent = `>> Command execution complete. Succeeded: ${data.succeeded}, Failed: ${data.failed}`;
        document.getElementById('cmd-output').appendChild(div);
      }
    });
  }

  function executeConfigPush() {
    const script = document.getElementById('config-script').value;
    if (!script.trim()) { alert("Config script is empty."); return; }
    const devices = gatherDevices();
    if (devices.length === 0) {
      alert("Please select a device or enter an IP address."); return;
    }
    if (!confirm(`Push this config to ${devices.length} device(s)? This cannot be auto-rolled-back.`)) return;

    clearOutput();
    const init = document.createElement('div');
    init.className = 'text-warning';
    init.textContent = `>> Pushing config to ${devices.length} target(s)...`;
    document.getElementById('cmd-output').appendChild(init);

    const payload = {
      devices,
      script,
      confirm: document.getElementById('config-confirm').value,
      save: document.getElementById('config-save').checked,
      timeout: 60,
    };
    streamSSE('/api/commands/config-run', payload, (data) => {
      if (data.type === 'progress') renderDeviceResult(data);
      else if (data.type === 'complete') {
        const div = document.createElement('div');
        div.className = 'mt-4 text-info fw-bold';
        div.textContent = `>> Config push complete. Succeeded: ${data.succeeded}, Failed: ${data.failed}`;
        document.getElementById('cmd-output').appendChild(div);
        document.getElementById('config-confirm').value = '';
        updateDeployBtn();
      }
    });
  }
</script>
