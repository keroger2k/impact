<div class="row g-4 h-100">
  <div class="col-md-3">
    <div class="card shadow-md border-0 animate-fade-in h-100">
      <div class="card-header bg-white border-bottom py-3">
        <div class="d-flex align-items-center gap-2 mb-3">
          <i class="ph ph-shield-check text-primary"></i>
          <span class="fw-bold text-navy">Cisco ISE Dashboard</span>
        </div>
        <!-- Endpoint quick-lookup -->
        <form hx-get="/api/ise/endpoints"
              hx-target="#ise-results"
              hx-indicator="#ise-loading"
              hx-sync="this:abort"
              onsubmit="document.querySelectorAll('#ise-sidebar .list-group-item').forEach(el => el.classList.remove('active'));">
          <label class="small text-muted fw-bold mb-1 d-block">ENDPOINT MAC LOOKUP</label>
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-light border-end-0">
              <i class="ph ph-magnifying-glass"></i>
            </span>
            <input type="text" name="mac" class="form-control border-start-0 ps-0"
              placeholder="AA:BB:CC:DD:EE:FF" required minlength="2"
              autocomplete="off" spellcheck="false">
            <button class="btn btn-primary btn-sm px-2" type="submit">
              <i class="ph ph-arrow-right"></i>
            </button>
          </div>
        </form>
      </div>
      <div class="card-body p-0 overflow-auto" style="max-height: calc(100vh - 230px);">
        <div id="ise-sidebar" class="list-group list-group-flush">

          <!-- OPERATIONAL -->
          <div class="px-4 py-2 small text-muted text-uppercase fw-bold bg-light border-bottom">Operational</div>
          <button class="list-group-item list-group-item-action py-2 px-4 active"
            hx-get="/api/ise/sessions/recent" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-radio-button me-2 text-success"></i> Recent Sessions
          </button>
          <button class="list-group-item list-group-item-action py-2 px-4"
            hx-get="/api/ise/sessions/active" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-users-three me-2"></i> Active Sessions
          </button>
          <button class="list-group-item list-group-item-action py-2 px-4 border-bottom"
            hx-get="/api/ise/deployment-nodes" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-hard-drives me-2"></i> Deployment Nodes
          </button>

          <!-- NETWORK ACCESS -->
          <div class="px-4 py-2 small text-muted text-uppercase fw-bold bg-light border-bottom">Network Access</div>
          <button class="list-group-item list-group-item-action py-2 px-4"
            hx-get="/api/ise/nads" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-shield me-2"></i> Network Access Devices
          </button>
          <button class="list-group-item list-group-item-action py-2 px-4 border-bottom"
            hx-get="/api/ise/device-groups" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-folders me-2"></i> NAD Groups
          </button>

          <!-- IDENTITY & POLICY -->
          <div class="px-4 py-2 small text-muted text-uppercase fw-bold bg-light border-bottom">Identity &amp; Policy</div>
          <button class="list-group-item list-group-item-action py-2 px-4"
            hx-get="/api/ise/users" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-user me-2"></i> Internal Users
          </button>
          <button class="list-group-item list-group-item-action py-2 px-4"
            hx-get="/api/ise/endpoint-groups" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-devices me-2"></i> Endpoint Groups
          </button>
          <button class="list-group-item list-group-item-action py-2 px-4"
            hx-get="/api/ise/profiling-policies" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-fingerprint me-2"></i> Profiling Policies
          </button>
          <button class="list-group-item list-group-item-action py-2 px-4 border-bottom"
            hx-get="/api/ise/policy-sets" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-scroll me-2"></i> Policy Sets
          </button>

          <!-- AUTHORIZATION -->
          <div class="px-4 py-2 small text-muted text-uppercase fw-bold bg-light border-bottom">Authorization</div>
          <button class="list-group-item list-group-item-action py-2 px-4"
            hx-get="/api/ise/authz-profiles" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-check-square me-2"></i> Authz Profiles
          </button>
          <button class="list-group-item list-group-item-action py-2 px-4 border-bottom"
            hx-get="/api/ise/allowed-protocols" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-plug me-2"></i> Allowed Protocols
          </button>

          <!-- TRUSTSEC -->
          <div class="px-4 py-2 small text-muted text-uppercase fw-bold bg-light border-bottom">TrustSec</div>
          <button class="list-group-item list-group-item-action py-2 px-4"
            hx-get="/api/ise/sgts" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-tag me-2"></i> Security Group Tags
          </button>
          <button class="list-group-item list-group-item-action py-2 px-4"
            hx-get="/api/ise/sgacls" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-funnel me-2"></i> SGACLs
          </button>
          <button class="list-group-item list-group-item-action py-2 px-4"
            hx-get="/api/ise/egress-matrix" hx-target="#ise-results" hx-indicator="#ise-loading"
            onclick="setActive(this)">
            <i class="ph ph-table me-2"></i> Egress Matrix
          </button>

        </div>
      </div>
    </div>
  </div>

  <div class="col-md-9 d-flex flex-column position-relative">
    <div id="ise-loading" class="htmx-indicator position-absolute top-0 start-0 w-100 h-100 bg-white bg-opacity-75" style="z-index: 100; pointer-events: none;">
      <div class="d-flex flex-column align-items-center justify-content-center h-100">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
        <p class="text-main font-weight-bold mt-3">Connecting to Cisco ISE...</p>
      </div>
    </div>
    <div id="ise-results"
      hx-get="/api/ise/sessions/recent"
      hx-trigger="load once"
      hx-indicator="#ise-loading"
      style="min-height: 600px;"
      class="table-container shadow-md">
    </div>
  </div>
</div>

<script>
function setActive(btn) {
  btn.closest('.list-group').querySelectorAll('.list-group-item').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
}
</script>

<style>
  .list-group-item {
    border: none;
    font-weight: 500;
    color: var(--text-muted);
    transition: all var(--transition);
    font-size: 13px;
  }
  .list-group-item i { font-size: 1.1rem; vertical-align: middle; }
  .list-group-item:hover { background-color: #F8FAFC; color: var(--accent); }
  .list-group-item.active { background-color: rgba(59, 130, 246, 0.05); color: var(--accent); border-left: 3px solid var(--accent); }
</style>
