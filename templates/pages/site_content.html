<div class="d-flex flex-column gap-3">

  <!-- ── Search bar ──────────────────────────────────────────────────────── -->
  <div class="card shadow-sm border-0 animate-fade-in">
    <div class="card-body py-3">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <div class="d-flex align-items-center gap-2">
          <i class="ph ph-buildings fs-4 text-primary"></i>
          <strong class="fs-5">Site Lookup</strong>
        </div>
        <form class="d-flex align-items-center gap-2 flex-grow-1"
              onsubmit="event.preventDefault(); const c = this.querySelector('[name=code]').value.trim().toUpperCase(); if (c) { htmx.ajax('GET', '/api/site/overview/' + encodeURIComponent(c), { target: '#site-overview', swap: 'innerHTML' }); history.replaceState(null, '', '/site/' + encodeURIComponent(c)); }">
          <div class="position-relative flex-grow-1" style="max-width:360px">
            <i class="ph ph-magnifying-glass position-absolute text-muted"
               style="left:10px; top:50%; transform:translateY(-50%); pointer-events:none;"></i>
            <input name="code" type="search" autocomplete="off" autofocus
                   class="form-control form-control-sm ps-4 text-uppercase"
                   placeholder="Site code (e.g. K023, SDCZ)"
                   value="{{ initial_code or '' }}">
          </div>
          <button class="btn btn-primary btn-sm" type="submit">
            <i class="ph ph-arrow-right me-1"></i>Lookup
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Overview swap target ───────────────────────────────────────────── -->
  <div id="site-overview"
       {% if initial_code %}hx-get="/api/site/overview/{{ initial_code }}" hx-trigger="load" hx-swap="innerHTML"{% endif %}>
    {% if not initial_code %}
      <div class="card shadow-sm border-0 animate-fade-in">
        <div class="card-body text-center text-muted py-5">
          <i class="ph ph-buildings ph-3x text-muted mb-3 d-block"></i>
          <h6 class="text-muted">Enter a site code above to see devices, IPAM, IPv6, tunnels, and routing.</h6>
        </div>
      </div>
    {% else %}
      <div class="card shadow-sm border-0">
        <div class="card-body text-center text-muted py-5">
          <i class="ph ph-circle-notch ph-spin ph-2x"></i>
          <div class="small mt-2">Loading site {{ initial_code }}…</div>
        </div>
      </div>
    {% endif %}
  </div>
</div>
