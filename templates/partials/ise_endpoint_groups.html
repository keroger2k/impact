<div class="card shadow-md border-0 animate-fade-in">
  <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="ph ph-devices text-primary"></i>
      <span class="fw-bold text-navy">Endpoint Identity Groups ({{ total }})</span>
    </div>
  </div>
  <div class="card-body p-0 overflow-auto" style="max-height: calc(100vh - 200px);">
    <table class="table table-hover table-striped mb-0 data-table">
      <thead class="bg-light sticky-top">
        <tr><th>Group Name</th><th>Description</th></tr>
      </thead>
      <tbody>
        {% for g in items %}
        <tr>
          <td class="fw-bold text-navy">{{ g.name }}</td>
          <td class="small text-muted">{{ g.description or '—' }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
