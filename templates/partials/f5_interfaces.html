<div class="card shadow-sm border-0 animate-fade-in">
  <div class="card-header bg-navy text-white d-flex justify-content-between align-items-center">
    <span class="fw-bold">Interfaces ({{ items|length }})</span>
    <button class="btn btn-sm btn-outline-light px-2"
            hx-get="/api/f5/interfaces" hx-target="#f5-results" hx-indicator="#f5-loading">
      <i class="ph ph-arrows-clockwise"></i>
    </button>
  </div>
  <div class="card-body p-0 overflow-auto" style="max-height: calc(100vh - 200px);">
    {% if not items %}
      <div class="text-center text-muted p-5">
        <i class="ph ph-plugs" style="font-size: 2.5rem;"></i>
        <p class="mt-2 mb-0">No interfaces cached yet.</p>
      </div>
    {% else %}
    <table class="table table-hover table-striped mb-0 data-table">
      <thead class="bg-light sticky-top">
        <tr><th>Host</th><th>Name</th><th>MAC</th><th>Enabled</th><th>Media</th><th>MTU</th></tr>
      </thead>
      <tbody>
        {% for i in items %}
        <tr>
          <td class="fw-bold text-navy">
            <a class="text-decoration-none text-navy" href="/f5/{{ i.hostname }}"
               hx-get="/f5/{{ i.hostname }}" hx-target="#main-content" hx-push-url="true" hx-swap="innerHTML">{{ i.hostname }}</a>
          </td>
          <td class="fw-bold mono">{{ i.name }}</td>
          <td class="mono small text-muted">{{ i.mac or '—' }}</td>
          <td><span class="badge {% if i.enabled %}bg-success-subtle text-success{% else %}bg-secondary-subtle text-secondary{% endif %}">{{ 'yes' if i.enabled else 'no' }}</span></td>
          <td class="small">{{ i.mediaActive }}</td>
          <td class="small">{{ i.mtu or '—' }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% endif %}
  </div>
</div>
