<div class="card shadow-md border-0 animate-fade-in mt-3">
  <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="ph ph-user text-primary"></i>
      <span class="fw-bold text-navy">User Details: {{ u.name }}</span>
    </div>
    <button class="btn btn-sm btn-outline-secondary" hx-get="/api/ise/users" hx-target="#ise-results">
      <i class="ph ph-arrow-left me-1"></i> Back to List
    </button>
  </div>
  <div class="card-body">
    <div class="row">
      <div class="col-md-6">
        <div class="p-3 bg-light rounded mb-3">
          <div class="small text-muted fw-bold mb-2 text-uppercase">Identity Information</div>
          <dl class="row mb-0 small">
            <dt class="col-5 text-muted">Username</dt>
            <dd class="col-7 fw-bold">{{ u.name }}</dd>
            <dt class="col-5 text-muted">ID</dt>
            <dd class="col-7 mono small">{{ u.id }}</dd>
            <dt class="col-5 text-muted">Description</dt>
            <dd class="col-7">{{ u.description or '—' }}</dd>
          </dl>
        </div>
      </div>
      <div class="col-md-6">
        <div class="p-3 bg-light rounded mb-3">
          <div class="small text-muted fw-bold mb-2 text-uppercase">Status & Security</div>
          <dl class="row mb-0 small">
            <dt class="col-5 text-muted">Enabled</dt>
            <dd class="col-7">
              <span class="badge {% if u.enabled %}bg-success-subtle text-success{% else %}bg-secondary-subtle text-secondary{% endif %}">
                {{ 'Yes' if u.enabled else 'No' }}
              </span>
            </dd>
            <dt class="col-5 text-muted">Password Policy</dt>
            <dd class="col-7">{{ u.passwordPolicy or 'Default' }}</dd>
          </dl>
        </div>
      </div>
    </div>
  </div>
</div>
