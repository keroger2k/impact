<div class="card shadow-md border-0 animate-fade-in">
  <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="ph ph-user text-primary"></i>
      <span class="fw-bold text-navy">Internal Users ({{ total }})</span>
    </div>
    <div class="d-flex gap-2">
       <input type="text" class="form-control form-control-sm" placeholder="Filter..."
         hx-get="/api/ise/users" hx-trigger="keyup changed delay:500ms"
         name="search" hx-target="#ise-results">
       <button class="btn btn-sm btn-outline-secondary px-2"
         hx-get="/api/ise/users" hx-target="#ise-results" hx-indicator="#ise-loading">
         <i class="ph ph-arrows-clockwise"></i>
       </button>
    </div>
  </div>
  <div class="card-body p-0 overflow-auto" style="max-height: calc(100vh - 200px);">
    <table class="table table-hover table-striped mb-0 data-table">
      <thead class="bg-light sticky-top">
        <tr>
          <th>Username</th>
          <th>Description</th>
          <th>Status</th>
          <th data-no-sort data-no-filter>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for item in items %}
        <tr>
          <td class="fw-bold text-navy">{{ item.name }}</td>
          <td class="small text-muted">{{ item.description or '—' }}</td>
          <td>
            {% if item.enabled %}
            <span class="status-dot ok"></span> Active
            {% else %}
            <span class="status-dot error"></span> Disabled
            {% endif %}
          </td>
          <td>
            <button class="btn btn-xs btn-outline-primary" hx-get="/api/ise/users/{{ item.id }}" hx-target="#ise-results" hx-indicator="#ise-loading">Details</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
