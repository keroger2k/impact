<div class="card shadow-md border-0 animate-fade-in">
  <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <i class="ph ph-funnel text-primary"></i>
      <span class="fw-bold text-navy">Security Group ACLs ({{ total }})</span>
    </div>
    <button class="btn btn-sm btn-outline-secondary px-2"
      hx-get="/api/ise/sgacls" hx-target="#ise-results" hx-indicator="#ise-loading">
      <i class="ph ph-arrows-clockwise"></i>
    </button>
  </div>
  <div class="card-body p-0 overflow-auto" style="max-height: calc(100vh - 200px);">
    <table class="table table-hover table-striped mb-0 data-table">
      <thead class="bg-light sticky-top">
        <tr>
          <th>Name</th>
          <th>IP Version</th>
          <th>Description</th>
          <th>ACL Content</th>
        </tr>
      </thead>
      <tbody>
        {% for acl in items %}
        <tr>
          <td class="fw-bold text-navy">{{ acl.name }}</td>
          <td><span class="badge bg-light text-muted">{{ acl.ipVersion or '—' }}</span></td>
          <td class="small text-muted">{{ acl.description or '—' }}</td>
          <td><pre class="mb-0 small bg-light p-1 rounded" style="max-width:300px;overflow:auto;">{{ acl.aclcontent or '—' }}</pre></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
