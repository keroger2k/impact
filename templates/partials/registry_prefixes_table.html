<table class="table table-hover table-striped mb-0 data-table">
  <thead class="bg-light">
    <tr>
      <th>Site</th>
      <th>CIDR</th>
      <th class="text-center">Fam</th>
      <th>Role</th>
      <th class="text-center">VLAN</th>
      <th>Status</th>
      <th>Source</th>
      <th>Audit</th>
    </tr>
  </thead>
  <tbody>
    {% for p in items %}
    <tr>
      <td class="font-monospace small">{{ p.site_code or '(shared)' }}</td>
      <td class="font-monospace fw-semibold">{{ p.cidr }}</td>
      <td class="text-center"><span class="badge bg-light text-dark border">v{{ p.family }}</span></td>
      <td class="small">{{ p.role or '' }}</td>
      <td class="text-center small">{{ p.vlan_id or '' }}</td>
      <td class="small">{{ p.status }}</td>
      <td class="small text-muted">{{ p.source }}</td>
      <td class="small">{{ p.audit_state or '' }}</td>
    </tr>
    {% else %}
    <tr><td colspan="8" class="text-center text-muted py-4">No prefixes.</td></tr>
    {% endfor %}
  </tbody>
</table>
